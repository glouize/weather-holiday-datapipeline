version: "3.8"

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase-weather
    ports:
      - "3000:3000"
    volumes:
      # Mounts your SQLite database into the container
      - ./warehouse_metabase.db:/data/warehouse_metabase.db
      # Persists Metabase's own internal H2 database (users, questions, dashboards)
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    restart: unless-stopped

volumes:
  metabase-data:
